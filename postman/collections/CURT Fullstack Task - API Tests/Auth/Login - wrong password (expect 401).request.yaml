$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "awab@example.com",
      "password": "WrongPassword"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 5000
