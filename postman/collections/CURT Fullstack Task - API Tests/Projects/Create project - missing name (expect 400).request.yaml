$kind: http-request
url: "{{baseUrl}}/projects"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "description": "No name given",
      "owner": "{{userId}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 2000
