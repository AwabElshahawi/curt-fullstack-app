$kind: http-request
url: "{{baseUrl}}/projects/{{projectId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Race Car Software v2",
      "description": "Updated description"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Name updated', () => pm.expect(pm.response.json().project.name).to.eql('Race Car Software v2'));
    language: text/javascript
order: 8000
