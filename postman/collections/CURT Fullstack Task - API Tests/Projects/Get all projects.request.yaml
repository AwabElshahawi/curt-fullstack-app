$kind: http-request
url: "{{baseUrl}}/projects"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Returns array', () => pm.expect(pm.response.json().projects).to.be.an('array'));
    language: text/javascript
order: 4000
