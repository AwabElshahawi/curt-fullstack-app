$kind: http-request
url: "{{baseUrl}}/projects/{{projectId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Owner is populated', () => pm.expect(pm.response.json().project.owner).to.be.an('object'));
    language: text/javascript
order: 5000
